[package]
name = "spankwallet"
version = "0.1.0"
description = "SpankWallet — non-custodial Solana passkey smart wallet, phase 1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spankwallet"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# STATUS.md sectie 124 (stap 6-opzet): verkort UITSLUITEND
# PENDING_ACTION_TIMELOCK_SECONDS (instructions.rs) voor lokale
# testbinaries - een echte 24u-wachttijd is op een echte
# solana-test-validator niet in redelijke tijd te warpen (de klok volgt
# echte slotproductie, geen instant-warp-RPC zoals BanksClient/LiteSVM).
# Default-off, NOOIT in default features, en actief gecontroleerd (niet
# alleen "staat standaard uit") door
# scripts/verify-no-test-features-in-binary.ts vóór elke devnet-buffer-build
# (build-devnet-buffer.sh) - zie de instructions.rs-commentaar bij de
# constante zelf voor waarom dit de gekozen aanpak is t.o.v. de twee
# afgewezen alternatieven.
test-fast-pending-timelock = []
# STATUS.md sectie 132/133 (stap B, glijdende-vensterlimiet): verkort
# UITSLUITEND WINDOW_DURATION_SECONDS (instructions.rs) voor lokale
# testbinaries - zelfde reden/aanpak als test-fast-pending-timelock
# hierboven (een echt 24u-venster is niet in redelijke tijd te warpen op
# een echte solana-test-validator, advanceOnChainClockPast wacht echte
# tijd af). Default-off, NOOIT in default features, actief gecontroleerd
# door scripts/verify-no-test-features-in-binary.ts - zie de
# instructions.rs-commentaar bij de constante zelf, EN sectie 124's
# root-cause-analyse (#[used]/SHF_GNU_RETAIN) voor waarom de marker een
# msg!()-aanroep is, geen static.
test-fast-spend-window = []
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("custom-heap"))',
    'cfg(feature, values("custom-panic"))',
    'cfg(feature, values("anchor-debug"))',
] }

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
solana-instructions-sysvar = "3.0.1"
solana-keccak-hasher = "3.1.0"
solana-sha256-hasher = "3.1.0"
