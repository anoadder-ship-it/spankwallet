[workspace]
# Losstaand van de root-Cargo-workspace (programs/spankwallet) - dit is een
# apart project (Tauri-migratie-ontwerp, STATUS.md), geen Anchor-programma.

[package]
name = "spankwallet-desktop"
version = "0.1.0"
description = "SpankWallet desktop-app (Tauri) - fase 0 van de browser->native-migratie, zie STATUS.md"
authors = ["SpankWallet"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spankwallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
iota_stronghold = "2"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
solana-sdk = "2"
solana-client = "2"
solana-secp256r1-program = "2"
p256 = "0.13"
base64 = "0.22"
# 0.2.0 op crates.io compileert niet (interne conflict: authenticator
# verwacht CredProps.rk: bool, webauthn-authenticator-rs pint
# webauthn-rs-proto exact op een versie waar dat Option<bool> is) - al
# gefixt op de git main-branch, nog niet als nieuwe crates.io-versie
# gepubliceerd. Vastgepind op de exacte, geverifieerde commit i.p.v. een
# losse branch/tag - reproduceerbaar, met bewuste user-goedkeuring
# (STATUS.md / Tauri-migratie-ontwerp).
tauri-plugin-webauthn = { git = "https://github.com/Profiidev/tauri-plugin-webauthn", rev = "d997cb6a6f5bb6ff42dbb623aaa632e98ea63012" }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"

