[workspace]
# Losstaand van de root-Cargo-workspace (programs/spankwallet) - dit is een
# apart project (Tauri-migratie-ontwerp, STATUS.md), geen Anchor-programma.

[package]
name = "spankwallet-desktop"
version = "0.1.0"
description = "SpankWallet desktop-app (Tauri) - fase 0 van de browser->native-migratie, zie STATUS.md"
authors = ["SpankWallet"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spankwallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
iota_stronghold = "2"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
solana-sdk = "2"
solana-rpc-client = "2"
solana-secp256r1-program = "2"
p256 = "0.13"
base64 = "0.22"
# Vervangt tauri-plugin-webauthn/mozilla-authenticator-rs (STATUS.md sectie
# 75): authenticator-rs bleek structureel te hangen op deze machine binnen
# perform_register, empirisch bewezen via Rust-instrumentatie. ctap-hid-
# fido2 is een eigen, from-scratch Rust-CTAP2-implementatie (GEEN libfido2-
# C-bindings-wrapper - geverifieerd tegen de crate's eigen Cargo.toml),
# provenance onderzocht: crates.io sinds 2020, MIT, actief onderhouden,
# cargo audit toont nul bekende RustSec-advisories.
ctap-hid-fido2 = "3.5.13"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"

