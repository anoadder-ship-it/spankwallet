[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
spankwallet = "9ma6vQVA71yUD6jqvyMuYXnMBYGoE7u9bTUbBYEMGBK9"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Glob tussen aanhalingstekens (STATUS.md sectie 167): mocha moet hem
# uitbreiden, niet de shell. Zonder globstar leest de shell `**` als `*`;
# zodra er een submap in tests/ staat (tests/unit/), matcht `tests/*/*.ts`
# en draaide alleen die submap - de rest van de suite viel stil weg, exit 0.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"${TEST_GLOB:-tests/**/*.ts}\""

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
gossip_port = 8001
ledger = ".anchor/test-ledger"
rpc_port = 8899
